<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complexity - Quick Access</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 0;
    }

    .popup-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 32px;
      height: 32px;
    }

    .header-text h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .header-text p {
      font-size: 11px;
      opacity: 0.9;
    }

    .menu {
      padding: 8px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin: 4px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      color: #1a202c;
    }

    .menu-item:hover {
      background: rgba(102, 126, 234, 0.1);
      transform: translateX(4px);
    }

    .menu-item-icon {
      font-size: 20px;
      width: 24px;
      text-align: center;
    }

    .menu-item-content {
      flex: 1;
    }

    .menu-item-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .menu-item-desc {
      font-size: 11px;
      color: #718096;
    }

    .divider {
      height: 1px;
      background: rgba(0, 0, 0, 0.1);
      margin: 8px 0;
    }

    .footer {
      padding: 12px;
      text-align: center;
      font-size: 11px;
      color: #718096;
      background: rgba(0, 0, 0, 0.02);
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #48bb78;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <img src="../../public/img/logo-48.png" alt="Complexity" class="logo">
      <div class="header-text">
        <h1>Complexity</h1>
        <p><span class="status-indicator"></span>Extension Active</p>
      </div>
    </div>

    <div class="menu">
      <button class="menu-item" id="launch-complexity">
        <span class="menu-item-icon">✨</span>
        <div class="menu-item-content">
          <div class="menu-item-title">Launch Complexity</div>
          <div class="menu-item-desc">Initialize tools in current tab</div>
        </div>
      </button>

      <button class="menu-item" id="open-settings">
        <span class="menu-item-icon">⚙️</span>
        <div class="menu-item-content">
          <div class="menu-item-title">Settings & Features</div>
          <div class="menu-item-desc">Configure all tools and options</div>
        </div>
      </button>

      <button class="menu-item" id="goto-perplexity">
        <span class="menu-item-icon">🚀</span>
        <div class="menu-item-content">
          <div class="menu-item-title">Open Perplexity</div>
          <div class="menu-item-desc">Go to Perplexity AI</div>
        </div>
      </button>

      <div class="divider"></div>

      <button class="menu-item" id="toggle-theme">
        <span class="menu-item-icon">🎨</span>
        <div class="menu-item-content">
          <div class="menu-item-title">Quick Theme Toggle</div>
          <div class="menu-item-desc">Switch light/dark mode</div>
        </div>
      </button>

      <button class="menu-item" id="export-data">
        <span class="menu-item-icon">📦</span>
        <div class="menu-item-content">
          <div class="menu-item-title">Export Conversations</div>
          <div class="menu-item-desc">Save your chat history</div>
        </div>
      </button>

      <div class="divider"></div>

      <button class="menu-item" id="help-docs">
        <span class="menu-item-icon">📚</span>
        <div class="menu-item-content">
          <div class="menu-item-title">Documentation</div>
          <div class="menu-item-desc">View guides and help</div>
        </div>
      </button>
    </div>

    <div class="footer">
      <span id="version">v2.7.11</span> • Made with ❤️ by pnd280
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
